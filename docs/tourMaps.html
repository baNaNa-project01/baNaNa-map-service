<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TourInfoMap</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- 배너 -->
    <div id="navbar">TourMap</div>

    <!-- 오늘 날짜 박스 (추후 기능 구현) -->
    <div id="infoBox">
      <div id="infoTitle">오늘 날짜</div>
      <div id="infoContent">2025.02.12</div>
    </div>

    <!-- 검색창 (키워드 검색) -->
    <div id="search">
      <input id="search_input" placeholder="어디로 갈까?" />
      <button id="search_btn">검색</button>
    </div>

    <!-- 카테고리 섹션 (버튼 형식) -->
    <div id="category_section">
      <h3>카테고리 검색</h3>
      <div id="category_buttons">
        <button class="category-btn" data-cat="MT1">대형마트 (MT1)</button>
        <button class="category-btn" data-cat="CS2">편의점 (CS2)</button>
        <button class="category-btn" data-cat="PS3">
          어린이집, 유치원 (PS3)
        </button>
        <button class="category-btn" data-cat="SC4">학교 (SC4)</button>
        <button class="category-btn" data-cat="AC5">학원 (AC5)</button>
        <button class="category-btn" data-cat="PK6">주차장 (PK6)</button>
        <button class="category-btn" data-cat="OL7">
          주유소, 충전소 (OL7)
        </button>
        <button class="category-btn" data-cat="SW8">지하철역 (SW8)</button>
        <button class="category-btn" data-cat="BK9">은행 (BK9)</button>
        <button class="category-btn" data-cat="CT1">문화시설 (CT1)</button>
        <button class="category-btn" data-cat="AG2">중개업소 (AG2)</button>
        <button class="category-btn" data-cat="PO3">공공기관 (PO3)</button>
        <button class="category-btn" data-cat="AT4">관광명소 (AT4)</button>
        <button class="category-btn" data-cat="AD5">숙박 (AD5)</button>
        <button class="category-btn" data-cat="FD6">음식점 (FD6)</button>
        <button class="category-btn" data-cat="CE7">카페 (CE7)</button>
        <button class="category-btn" data-cat="HP8">병원 (HP8)</button>
        <button class="category-btn" data-cat="PM9">약국 (PM9)</button>
      </div>
    </div>

    <!-- 기존 옵션박스형 카테고리 영역은 숨김 -->
    <div id="category_search" style="display: none"></div>

    <!-- 검색 결과 목록 (검색 전엔 숨김 처리) -->
    <div id="menu_wrap">
      <ul id="placesList"></ul>
      <div id="pagination"></div>
    </div>

    <!-- 현재 위치 버튼 -->
    <div id="current">현재 위치</div>

    <!-- 지도 영역 -->
    <div id="map" style="width: 100%; height: 100vh"></div>
    <script src="app.js"></script>
  </body>
</html>
